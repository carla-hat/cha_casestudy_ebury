services:

  postgres:
    image: postgres:16
    
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=analytics
    ports:
      - "5432:5432"
  eburydecasestudypack:
    image: eburydecasestudypack
    build:
      context: .
      dockerfile: ./Dockerfile
